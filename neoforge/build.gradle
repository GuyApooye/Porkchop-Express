plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {

    def loader = "neoforge"

    def veil = "foundry.veil:veil-${loader}-${minecraft_version}:${veil_version}"
    implementation(veil) {
        exclude group: 'maven.modrinth'
        exclude group: 'me.fallenbreath'
    }

    def flywheelApi = "dev.engine-room.flywheel:flywheel-${loader}-api-${minecraft_version}:${flywheel_version}"
    compileOnly(flywheelApi)

    def flywheel = "dev.engine-room.flywheel:flywheel-${loader}-${minecraft_version}:${flywheel_version}"
    implementation(flywheel)

    def sable = "dev.ryanhcode.sable:sable-${project.name}-${minecraft_version}:${sable_version}"
    implementation(sable) {
        exclude group: 'foundry.veil'
    }

    runtimeOnly("mezz.jei:jei-${minecraft_version}-${loader}:${jei_version}")
    runtimeOnly("dev.simulated_team.simulated:simulated-${loader}-${minecraft_version}:${simulated_version}")
    runtimeOnly("dev.eriksonn.aeronautics:aeronautics-${loader}-${minecraft_version}:${simulated_version}")
    runtimeOnly("dev.ryanhcode.offroad:offroad-${loader}-${minecraft_version}:${simulated_version}")

//    def sableCompanion = "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
//    api(sableCompanion)
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }

        client {
            client()
            programArgument("--username=Dev1")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file("run-data")
            programArguments.addAll'--mod', project.mod_id, '--all', '--output', file('../common/src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir '../common/src/generated/resources/' }
